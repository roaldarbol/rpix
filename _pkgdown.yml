url: https://roald-arboel.com/rpix/
home:
  title: "rpix – Manage R project dependencies with Pixi"

# Same layout as the animovement package sites (theme and pkgdown/extra.scss
# copied from animovementtemplate), without the animovement-specific navbar.
template:
  bootstrap: 5
  light-switch: true
  # Pixi's palette (pixi.prefix.dev), as Pixiline's site uses: navy text on
  # warm off-white, with a golden-yellow accent; navy and yellow in dark mode.
  # The dark mode colours are in pkgdown/extra.scss.
  theme: github-light
  theme-dark: github-dark
  bslib:
    primary: "#001838"
    body-bg: "#F8F6F2"
    body-color: "#001838"
    # Pixi's link blue is #5773FF, which is too light for text on #F8F6F2
    # (3.7:1); this one is 5:1.
    link-color: "#3D5AF1"
    # As Pixi's header: white in light mode, slate in dark mode
    navbar-light-bg: "#FFFFFF"
    navbar-dark-bg: "#181F25"
    # Both SIL Open Font License, fetched at build time and written into the
    # site's deps/, so pages make no request to Google.
    base_font: {google: "Source Sans Pro"}
    code_font: {google: "Source Code Pro"}
    # Bootstrap derives its heading scale from this, so h1 lands at 3rem.
    font_size_base: 1.2rem
    # Half of it becomes the container's horizontal padding; it's also the
    # column gutter, which opens up the gap to the sidebar.
    grid_gutter_width: 3rem

authors:
  Mikkel Roald-Arbøl:
    href: https://roald-arboel.com

navbar:
  structure:
    left: [reference, articles, news]
    right: [search, pixi, discussions, discord, github, lightswitch]
  components:
    reference:
      icon: fa fa-file-code
      text: Reference
      href: reference/index.html
      aria-label: Reference
    news:
      icon: fa fa-newspaper
      text: News
      href: news/index.html
      aria-label: News
    pixi:
      text: Pixi
      href: https://pixi.prefix.dev
      aria-label: Pixi documentation
    discussions:
      icon: fa-comments
      href: https://github.com/roaldarbol/rpix/discussions
      aria-label: GitHub Discussions
    discord:
      icon: fab fa-discord
      href: https://discord.com/invite/kKV8ZxyzY4
      aria-label: Discord of prefix.dev, the makers of Pixi

articles:
  - title: "Get started"
    navbar: ~
    contents:
      - articles/getting-started

  - title: "Guides"
    navbar: Guides
    contents:
      - articles/ide
      - articles/finding-packages
      - articles/environments
      - articles/coming-from-renv
      - articles/reproducibility
      - articles/private-channels

  - title: "Background"
    navbar: Background
    contents:
      - articles/how-rpix-works
      - articles/troubleshooting

reference:
  - title: "Managing dependencies"
    contents:
      - pixi_add
      - pixi_remove
      - pixi_search
      - pixi_scan
      - pixi_install

  - title: "Environments, channels and platforms"
    contents:
      - pixi_environments
      - pixi_switch
      - pixi_r
      - pixi_add_channel

  - title: "Developing a package"
    contents:
      - pixi_import_description
      - pixi_check_matrix

  - title: "Private channels"
    contents:
      - pixi_auth_login

  - title: "Tasks"
    contents:
      - pixi_tasks

  - title: "Inspecting a project"
    contents:
      - pixi_sitrep
      - pixi_info

  - title: "Setting up a project"
    contents:
      - install_pixi
      - use_pixi
      - use_pixi_ide
      - pixi_import_renv
      - pixi_activate
