# Every new or changed line must be covered by tests, and overall coverage
# must not drop. Overall coverage reaches 100% once the legacy functions are
# replaced (#22, #26, #32).
coverage:
  status:
    patch:
      default:
        target: 100%
    project:
      default:
        target: auto
        threshold: 0%

# Comment only when something needs doing: overall coverage drops, or the pull
# request adds lines the tests don't cover. Same rule as the animovement
# packages.
comment:
  require_changes: "coverage_drop OR uncovered_patch"
