# Development environment for rpix. See the tasks below, e.g. `pixi run test`.
[workspace]
name = "rpix"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
r-base = "4.5.*"
r-cli = ">=3.6.6,<4"
r-jsonlite = ">=2.0.0,<3"
r-processx = ">=3.9.0,<4"
r-devtools = ">=2.5.0,<3"
r-roxygen2 = ">=8.1.0,<9"
r-testthat = ">=3.3.1,<4"
r-withr = ">=3.0.3,<4"
r-rcmdcheck = ">=1.4.0,<2"
r-pkgdown = ">=2.2.1,<3"
r-quarto = ">=1.5.1,<2"
quarto = ">=1.9.38,<2"
air = ">=0.12.0,<0.13"
python = ">=3.14.8,<3.15"

# Keep packages from the user library (installed for another R) out of this
# environment's R, which would otherwise put it first on .libPaths()
[activation.env]
R_LIBS_USER = "$PIXI_PROJECT_ROOT/.pixi/r-libs/$PIXI_ENVIRONMENT_NAME"

[tasks]
document = { cmd = "Rscript -e 'devtools::document()'", description = "Regenerate man/ and NAMESPACE from the roxygen comments" }
test = { cmd = "Rscript -e 'devtools::test()'", description = "Run the tests" }
check = { cmd = "Rscript -e 'devtools::check()'", description = "Run R CMD check" }
format = { cmd = "air format .", description = "Format the R code with air" }
readme = { cmd = "quarto render README.qmd", description = "Render README.md from README.qmd" }
# CI=true skips building favicons, as on GitHub: the service pkgdown uses for
# them is unreliable
site = { cmd = "Rscript -e 'pkgdown::build_site(preview = FALSE)'", env = { CI = "true" }, description = "Build the pkgdown site into docs/" }
preview = { cmd = "python -m http.server --bind 127.0.0.1 --directory docs 8000", depends-on = ["site"], description = "Build the site and serve it at http://127.0.0.1:8000 (stop with Ctrl+C)" }
