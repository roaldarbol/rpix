# R CMD check across the standard matrix, with pixi installed so the tests that
# call it run as well. Adapted from the animovement packages' shared workflow
# (https://github.com/animovement/.github), derived from
# https://github.com/r-lib/actions/tree/v2/examples
name: R-CMD-check

on:
  push:
    branches: [main, master]
  # Every pull request, whatever it targets, so stacked pull requests are
  # checked too.
  pull_request:

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    # Fail a hung step (e.g. a stalled download in r-lib/actions/setup-r)
    # instead of waiting for GitHub\'s 6-hour default
    timeout-minutes: 30

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        # R-devel has no binaries, so it runs on merges to main, not on PRs.
        config: >-
          ${{ github.event_name == 'pull_request'
          && fromJSON('[
            {"os": "macos-latest", "r": "release"},
            {"os": "windows-latest", "r": "release"},
            {"os": "ubuntu-latest", "r": "release"},
            {"os": "ubuntu-latest", "r": "oldrel-1"}
          ]')
          || fromJSON('[
            {"os": "macos-latest", "r": "release"},
            {"os": "windows-latest", "r": "release"},
            {"os": "ubuntu-latest", "r": "devel", "http-user-agent": "release"},
            {"os": "ubuntu-latest", "r": "release"},
            {"os": "ubuntu-latest", "r": "oldrel-1"}
          ]') }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false

      - uses: r-lib/actions/setup-pandoc@v2

      # Ubuntu's mirror sometimes stalls on a download, and apt then waits
      # minutes before trying again. Give up after 20 seconds and retry (#140).
      - name: Make apt retry stalled downloads quickly
        if: runner.os == 'Linux'
        run: echo 'Acquire::Retries "3"; Acquire::http::Timeout "20"; Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/99-timeouts

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  # As CRAN checks rpix: --as-cran, without NOT_CRAN, and without pixi, so the
  # tests and examples that need pixi skip and nothing else fails
  as-cran:
    runs-on: ubuntu-latest
    # Fail a hung step instead of waiting for GitHub\'s 6-hour default
    timeout-minutes: 30

    name: ubuntu-latest (as CRAN)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      # Ubuntu's mirror sometimes stalls on a download, and apt then waits
      # minutes before trying again. Give up after 20 seconds and retry (#140).
      - name: Make apt retry stalled downloads quickly
        if: runner.os == 'Linux'
        run: echo 'Acquire::Retries "3"; Acquire::http::Timeout "20"; Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/99-timeouts

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  # The oldest Pixi rpix supports, as DESCRIPTION's SystemRequirements gives
  # it, so that stays true. The other jobs get the newest Pixi.
  pixi-minimum:
    runs-on: ubuntu-latest
    # Fail a hung step instead of waiting for GitHub\'s 6-hour default
    timeout-minutes: 30

    name: ubuntu-latest (oldest pixi)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - name: Read the oldest Pixi from DESCRIPTION
        id: pixi-minimum
        run: |
          version=$(sed -n 's/^SystemRequirements:.*pixi (>= *\([0-9.]*\)).*/\1/p' DESCRIPTION)
          if [ -z "$version" ]; then
            echo "::error::DESCRIPTION's SystemRequirements has no 'pixi (>= x.y)'"
            exit 1
          fi
          # setup-pixi wants a full version: 0.74 -> v0.74.0
          if [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then version="$version.0"; fi
          echo "version=v$version" >> "$GITHUB_OUTPUT"

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: ${{ steps.pixi-minimum.outputs.version }}
          run-install: false

      - uses: r-lib/actions/setup-pandoc@v2

      # Ubuntu's mirror sometimes stalls on a download, and apt then waits
      # minutes before trying again. Give up after 20 seconds and retry (#140).
      - name: Make apt retry stalled downloads quickly
        if: runner.os == 'Linux'
        run: echo 'Acquire::Retries "3"; Acquire::http::Timeout "20"; Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/99-timeouts

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      # The tests mock source builds, but the build backend is what needs this
      # Pixi (0.77 is the first that pixi-build-r 0.2.0 works with), so build
      # a package from GitHub for real
      - name: Build a package from GitHub
        run: |
          R CMD INSTALL .
          project="$RUNNER_TEMP/github-build"
          pixi init "$project" --channel conda-forge
          Rscript -e 'rpix::pixi_add(c("r-base=4.5", "conda::conda-ecosystem-user-package-isolation"), path = commandArgs(TRUE))' "$project"
          Rscript -e 'rpix::pixi_add("github::cran/praise", path = commandArgs(TRUE))' "$project"
          pixi run --manifest-path "$project/pixi.toml" Rscript -e 'cat(praise::praise(), "\n")'

  # The same check in the pixi development environment (pixi.toml), so rpix is
  # also checked with conda-forge's R, which is the R it is meant for
  pixi:
    runs-on: ${{ matrix.os }}
    # Fail a hung step (e.g. a stalled download in r-lib/actions/setup-r)
    # instead of waiting for GitHub\'s 6-hour default
    timeout-minutes: 30

    name: ${{ matrix.os }} (pixi)

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: Check
        run: pixi run check

      # conda-ecosystem-user-package-isolation should keep the personal
      # library out of the environment's R
      - name: Check that R only uses the environment's library
        shell: bash
        run: |
          # Create R's default personal library, so the check fails if R uses it
          pixi run bash -c 'unset R_LIBS_USER; Rscript -e "lib <- Sys.getenv(\"R_LIBS_USER\"); dir.create(lib, recursive = TRUE, showWarnings = FALSE); cat(\"personal library:\", lib, \"\n\")"'
          pixi run Rscript -e "print(Sys.getenv('R_LIBS_USER')); print(.libPaths()); stopifnot(all(grepl('/[.]pixi/envs/', .libPaths())))"
