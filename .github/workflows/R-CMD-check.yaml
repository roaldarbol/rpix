# R CMD check across the standard matrix, with pixi installed so the tests that
# call it run as well. Adapted from the animovement packages' shared workflow
# (https://github.com/animovement/.github), derived from
# https://github.com/r-lib/actions/tree/v2/examples
name: R-CMD-check

on:
  push:
    branches: [main, master]
  # Every pull request, whatever it targets, so stacked pull requests are
  # checked too.
  pull_request:

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    # Fail a hung step (e.g. a stalled download in r-lib/actions/setup-r)
    # instead of waiting for GitHub\'s 6-hour default
    timeout-minutes: 30

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        # R-devel has no binaries, so it runs on merges to main, not on PRs.
        config: >-
          ${{ github.event_name == 'pull_request'
          && fromJSON('[
            {"os": "macos-latest", "r": "release"},
            {"os": "windows-latest", "r": "release"},
            {"os": "ubuntu-latest", "r": "release"},
            {"os": "ubuntu-latest", "r": "oldrel-1"}
          ]')
          || fromJSON('[
            {"os": "macos-latest", "r": "release"},
            {"os": "windows-latest", "r": "release"},
            {"os": "ubuntu-latest", "r": "devel", "http-user-agent": "release"},
            {"os": "ubuntu-latest", "r": "release"},
            {"os": "ubuntu-latest", "r": "oldrel-1"}
          ]') }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  # The same check in the pixi development environment (pixi.toml), so rpix is
  # also checked with conda-forge's R, which is the R it is meant for
  pixi:
    runs-on: ${{ matrix.os }}
    # Fail a hung step (e.g. a stalled download in r-lib/actions/setup-r)
    # instead of waiting for GitHub\'s 6-hour default
    timeout-minutes: 30

    name: ${{ matrix.os }} (pixi)

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: Check
        run: pixi run check

      # conda-ecosystem-user-package-isolation should keep the personal
      # library out of the environment's R
      - name: Check that R only uses the environment's library
        shell: bash
        run: |
          # Create R's default personal library, so the check fails if R uses it
          pixi run bash -c 'unset R_LIBS_USER; Rscript -e "lib <- Sys.getenv(\"R_LIBS_USER\"); dir.create(lib, recursive = TRUE, showWarnings = FALSE); cat(\"personal library:\", lib, \"\n\")"'
          pixi run Rscript -e "print(Sys.getenv('R_LIBS_USER')); print(.libPaths()); stopifnot(all(grepl('/[.]pixi/envs/', .libPaths())))"
