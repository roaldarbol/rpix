# Temporary: evidence for two Pixi issues. pixi-build-r without the build
# tools SystemRequirements names, in a container without the runner's own
# cmake and pkg-config; and exclude-newer reaching the build backend.
name: test-upstream-drafts

on:
  workflow_dispatch:

permissions: read-all

jobs:
  build-tools:
    name: ${{ matrix.package }} without ${{ matrix.tool }}, clean container
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: sundialr, tool: cmake }
          - { package: xmlrectr, tool: pkg-config }
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Pixi, and nothing else
        run: |
          apt-get update -qq && apt-get install -y -qq curl ca-certificates git > /dev/null
          curl -fsSL https://pixi.sh/install.sh | PIXI_VERSION=v0.81.0 bash
          echo "$HOME/.pixi/bin" >> $GITHUB_PATH
          for t in cmake pkg-config java cc gcc make; do printf "%s: " $t; command -v $t || echo "not on the PATH"; done
      - name: Without the tool, then with it
        run: |
          pkg=${{ matrix.package }}
          lower=$(echo $pkg | tr A-Z a-z)
          for with in no yes; do
            rm -rf p && mkdir p && cd p
            extra=""
            [ $with = yes ] && extra=", build-dependencies = { ${{ matrix.tool }} = \"*\" }"
            cat > pixi.toml <<TOML
          [workspace]
          name = "t"
          channels = ["conda-forge"]
          platforms = ["linux-64"]
          preview = ["pixi-build"]
          [dependencies]
          r-base = "4.5.*"
          r-$lower = { git = "https://github.com/cran/$pkg", package = { build.backend.name = "pixi-build-r", host-dependencies = { r-base = "4.5.*" }$extra } }
          TOML
            set +e
            pixi run Rscript -e "library($pkg); cat('LOADED\n')" > ../log-$with.txt 2>&1
            echo "exit $?" >> ../log-$with.txt
            set -e
            echo "::group::$pkg, with ${{ matrix.tool }}: $with"
            sed 's/\x1b\[[0-9;]*m//g' ../log-$with.txt | grep -E "LOADED|^exit|ERROR|rror:|not found|No such|cannot|failed|cmake|pkg-config" | grep -v "Building C" | head -25
            echo "::endgroup::"
            cd ..
          done

  exclude-newer:
    name: exclude-newer, overriding pixi-build-r and its API version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          run-install: false
      - name: Build fortunes from source
        run: |
          mkdir p && cd p
          cat > pixi.toml <<TOML
          [workspace]
          name = "t"
          channels = ["conda-forge"]
          platforms = ["linux-64"]
          preview = ["pixi-build"]
          exclude-newer = "2025-06-01"
          [dependencies]
          r-base = "4.5.*"
          r-fortunes = { git = "https://github.com/cran/fortunes", package = { build.backend.name = "pixi-build-r", host-dependencies = { r-base = "4.5.*" } } }
          [exclude-newer]
          pixi-build-r = "0d"
          pixi-build-api-version = "0d"
          TOML
          set +e
          pixi run Rscript -e "library(fortunes); cat('LOADED\n')" > ../log.txt 2>&1
          echo "exit $?"
          set -e
          sed 's/\x1b\[[0-9;]*m//g' ../log.txt | grep -iE "LOADED|cannot be installed|excluded|error|would require|r-base" | head -30
