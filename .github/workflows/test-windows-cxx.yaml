# Temporary: why sundialr's configure says "C++ compiler cannot create
# executables" on Windows. Builds it as pixi-build-r does (compiler('c') and
# compiler('cxx')), and with conda-forge's compilers for R on Windows instead
# (m2w64 gcc/gxx, as in conda-forge's R recipes), then shows what the build
# environment has.
name: test-windows-cxx

on:
  push:
    branches: [test/windows-source-builds]
  workflow_dispatch:

permissions: read-all

jobs:
  build:
    name: ${{ matrix.package }}, ${{ matrix.variant }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: sundialr, variant: no-fortran-m2-perl }
    defaults:
      run:
        shell: bash
    steps:
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.82.0
          run-install: false
      - name: The runner's own compilers, on the PATH
        run: |
          for c in gcc g++ cl cmake; do printf "%s: " $c; command -v $c || echo "-"; done
      - name: Build and load
        id: run
        run: |
          backend='name = "pixi-build-r", version = "0.2.*", channels = ["https://prefix.dev/pixi-build-backends", "conda-forge"]'
          tools='m2-make = "*", m2-sed = "*", m2-coreutils = "*"'
          config=''
          if [ "${{ matrix.variant }}" = no-fortran ]; then
            # pixi-build-r's compilers without Fortran, i.e. without flang
            config=', config = { compilers = ["c", "cxx"] }'
          fi
          if [ "${{ matrix.variant }}" = no-fortran-m2-perl ]; then
            config=', config = { compilers = ["c", "cxx"] }'
            tools="$tools, m2-perl = \"*\""
          fi
          if [ "${{ matrix.variant }}" = no-fortran-msys-makefiles ]; then
            config=', config = { compilers = ["c", "cxx"], env = { CMAKE_GENERATOR = "MSYS Makefiles" } }'
          fi
          if [ "${{ matrix.variant }}" = no-fortran-unix-makefiles ]; then
            config=', config = { compilers = ["c", "cxx"], env = { CMAKE_GENERATOR = "Unix Makefiles" } }'
          fi
          if [ "${{ matrix.variant }}" = ldflags-cleared ]; then
            config=', config = { env = { LDFLAGS = "" } }'
          fi
          if [ "${{ matrix.variant }}" = m2w64-compilers ]; then
            config=', config = { compilers = [] }'
            tools="$tools, gcc_win-64 = \"15.*\", gxx_win-64 = \"15.*\", m2w64-sysroot_win-64 = \"12.*\""
          fi
          if [ "${{ matrix.package }}" = minimal ]; then
            mkdir -p minimal/R minimal/src
            printf 'Package: minimal\nVersion: 0.1\nTitle: Minimal\nDescription: Minimal.\nLicense: MIT\nAuthors@R: person("A", "B", role = c("aut", "cre"), email = "a@b.c")\nNeedsCompilation: yes\n' > minimal/DESCRIPTION
            echo 'useDynLib(minimal)' > minimal/NAMESPACE
            printf 'extern "C" void R_init_minimal(void *dll) {}\n' > minimal/src/minimal.cpp
            cat > minimal/configure.win <<'SH'
          #!/bin/sh
          # What autoconf's AC_PROG_CXX does: R's compiler, with the environment's flags
          CXX=`"${R_HOME}/bin/R" CMD config CXX`
          echo "configure: LDFLAGS=$LDFLAGS"
          echo 'int main(void) { return 0; }' > conftest.cpp
          $CXX $CXXFLAGS $CPPFLAGS $LDFLAGS conftest.cpp -o conftest.exe || { echo "C++ compiler cannot create executables"; exit 1; }
          rm -f conftest.cpp conftest.exe
          SH
            src='path = "../minimal"'
            name=minimal
          else
            src='git = "https://github.com/cran/sundialr"'
            name=sundialr
          fi
          mkdir p && cd p
          cat > pixi.toml <<TOML
          [workspace]
          name = "t"
          channels = ["conda-forge"]
          platforms = ["win-64"]
          preview = ["pixi-build"]
          [dependencies]
          r-base = "4.5.*"
          r-$name = { $src, package = { build = { backend = { $backend }$config }, host-dependencies = { r-base = "4.5.*" }, build-dependencies = { $tools } } }
          TOML
          cat pixi.toml
          set +e
          pixi run -v Rscript -e "library($name); cat('LOADED\n')" > ../log.txt 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          clean=$(sed 's/\x1b\[[0-9;]*m//g' ../log.txt)
          echo "--- build environment's compiler packages"
          grep -E "^\s*│?\s*│?\s*│?\s*(vs20[0-9]+|vs_win|gcc|gxx|m2w64|cmake|clang|lld)[a-z0-9_-]* " <<< "$clean" | sort -u | head -20 || true
          echo "--- errors"
          grep -E "error|ERROR" <<< "$clean" | grep -v "errorlevel\|RB_SECTION" | head -15 || true
          grep -q LOADED <<< "$clean" && echo "LOADED" || echo "NOT LOADED"
      - name: Inside the build environment
        if: always()
        run: |
          work=$(ls -d p/.pixi/bld/r-${{ matrix.package }}/*/work 2>/dev/null | head -1)
          if [ -z "$work" ]; then echo "no work directory left"; exit 0; fi
          cat > diag.bat <<BAT
          @echo off
          cd /d "$(cygpath -w "$work")"
          call build_env.bat > nul
          echo --- CC=%CC%  CXX=%CXX%
          echo --- LDFLAGS=%LDFLAGS%
          echo --- CFLAGS=%CFLAGS%
          echo --- CXXFLAGS=%CXXFLAGS%
          echo --- CPPFLAGS=%CPPFLAGS%
          echo --- R CMD config CC / CXX / CXX17
          call R.exe CMD config CC
          call R.exe CMD config CXX
          call R.exe CMD config CXX17
          echo --- R CMD INSTALL by hand, full log in install-full.log
          git clone -q --depth 1 https://github.com/cran/sundialr "%TEMP%\sundialr-src"
          mkdir "%TEMP%\rlib"
          call R.exe CMD INSTALL --no-lock --library="%TEMP%\rlib" "%TEMP%\sundialr-src" > "%GITHUB_WORKSPACE%\install-full.log" 2>&1
          echo --- exit %ERRORLEVEL%
          echo --- where perl
          where perl
          echo --- where gcc / g++ / cl / x86_64-w64-mingw32-g++
          where gcc
          where g++
          where cl
          where x86_64-w64-mingw32-g++
          BAT
          cmd //c diag.bat || true
          bld=$(dirname "$work")/bld
          echo "--- activation scripts that set the clang_rt flag"
          grep -ril "defaultlib" "$bld/etc/conda/activate.d" 2>/dev/null || echo "(none)"
          echo "--- build packages that depend on clang"
          for f in "$bld"/conda-meta/*.json; do
            if grep -qE '"(clang|clangxx|clangdev|lld|clang-tools)( [^"]*)?"' "$f"; then
              name=$(basename "$f" .json)
              deps=$(grep -oE '"(clang|clangxx|clangdev|lld|clang-tools)( [^"]*)?"' "$f" | tr '\n' ' ')
              echo "$name: $deps"
            fi
          done
          echo "--- the hand-run install: CMake, make and the SUNDIALS build"
          grep -nE "Building for|Generator|CMake Error|CMake Warning|cmake|make(\[[0-9]\])?: |No targets|Selecting Windows SDK|identification|Make install|sundials|perl|Error|error|Installing|lib" install-full.log | grep -v "^.*-I\|g++ -std" | cut -c1-260 | head -80 || true
          echo "--- CMake's generator and errors"
          sed 's/\x1b\[[0-9;]*m//g' log.txt | grep -E "Building for|CMAKE_GENERATOR|Generator|CMake Error|CMake Warning|make(\[[0-9]\])?: |No targets|Selecting Windows SDK|The C compiler identification|Make install failed|perl" | cut -c1-300 | head -30 || true
          echo "--- the link error, in full"
          grep -n -B40 "collect2.exe: error" log.txt 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | cut -c1-400 | head -45 || true
          log=$(find "$HOME/AppData/Local/rattler/cache/git-v0/checkouts" -name config.log 2>/dev/null | head -1)
          if [ -n "$log" ]; then echo "--- $log"; grep -n -B2 -A25 "checking whether the C++ compiler works" "$log" | head -60; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-full-${{ matrix.package }}-${{ matrix.variant }}
          path: install-full.log
      - name: Result
        run: |
          echo "## ${{ matrix.package }}, ${{ matrix.variant }}: exit ${{ steps.run.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          exit ${{ steps.run.outputs.status }}
