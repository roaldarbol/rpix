# Temporary: does pixi-build-r 0.2.0 (prefix-dev/pixi#7271), from prefix.dev's
# backend channel until it's on conda-forge, add what rpix adds as stopgaps
# (#148-#150, #152): Rust, R's recommended packages, R's library folder on
# Windows, and CMake? The entries have none of those extras.
name: test-pixi-build-r-020

on:
  workflow_dispatch:

permissions: read-all

jobs:
  build:
    name: ${{ matrix.package }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        package: [hellorust, ACSWR, sundialr]
        exclude:
          # sundialr's own build doesn't work on Windows outside Rtools (#191)
          - { os: windows-latest, package: sundialr }
    defaults:
      run:
        shell: bash
    steps:
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.82.0
          run-install: false
      - name: Build and load
        run: |
          pkg=${{ matrix.package }}
          lower=$(echo $pkg | tr A-Z a-z)
          windows=""
          platform=linux-64
          [ "$RUNNER_OS" = macOS ] && platform=osx-arm64
          if [ "$RUNNER_OS" = Windows ]; then
            platform=win-64
            # MSYS2's tools: rpix still adds these on Windows (prefix-dev/pixi#7232)
            windows=', target.win-64.build-dependencies = { m2-make = "*", m2-sed = "*", m2-coreutils = "*" }'
          fi
          # As rpix writes the entry since the stopgaps went: pixi-build-r from
          # conda-forge, 0.2 or later
          backend='build.backend.name = "pixi-build-r", build.backend.version = ">=0.2"'
          if [ "$RUNNER_OS" = Windows ]; then
            backend="$backend, build.target.win-64.config.compilers = []"
            windows=', target.win-64.build-dependencies = { m2-make = "*", m2-sed = "*", m2-coreutils = "*", gcc_win-64 = "*", gxx_win-64 = "*", gfortran_win-64 = "*" }'
          fi
          mkdir p && cd p
          cat > pixi.toml <<TOML
          [workspace]
          name = "t"
          channels = ["conda-forge"]
          platforms = ["$platform"]
          preview = ["pixi-build"]
          [dependencies]
          r-base = "4.5.*"
          r-$lower = { git = "https://github.com/cran/$pkg", package = { $backend, host-dependencies = { r-base = "4.5.*" }$windows } }
          TOML
          cat pixi.toml
          set +e
          pixi run -v Rscript -e "library($pkg); cat('LOADED\n')" > ../log.txt 2>&1
          status=$?
          set -e
          clean=$(sed 's/\x1b\[[0-9;]*m//g' ../log.txt)
          grep -iE "pixi-build-r@|^ *(cmake|rust|r-mass) |Lib.R.library|ERROR|there is no package" <<< "$clean" | grep -v "CMAKE_ARGS\|Compiling\|Downloaded" | head -15 || true
          grep -q LOADED <<< "$clean" && echo "LOADED" || echo "NOT LOADED"
          echo "## ${{ matrix.package }} on ${{ matrix.os }}: exit $status" >> $GITHUB_STEP_SUMMARY
          exit $status
