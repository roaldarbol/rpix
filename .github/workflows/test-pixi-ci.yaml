# Temporary (#107): does r-lib's check-r-package work as it is after
# setup-pixi, with the environment from pixi.lock activated? And the same
# check as a Pixi task, for comparison.
name: test-pixi-ci

on:
  push:
    branches: [test/windows-source-builds]

permissions: read-all

jobs:
  check-r-package:
    name: ${{ matrix.os }} / check-r-package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          cache: true
          activate-environment: true
      - name: Which R
        run: Rscript -e "cat(R.home(), '\n'); print(.libPaths())"
        shell: bash
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual")'
          args: 'c("--no-manual")'

  pixi-task:
    name: ${{ matrix.os }} / pixi run check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          cache: true
      - run: pixi run check
