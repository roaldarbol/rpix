# Reports test coverage to Codecov. Adapted from the animovement packages'
# shared workflow (https://github.com/animovement/.github), derived from
# https://github.com/r-lib/actions/tree/v2/examples
name: test-coverage

on:
  push:
    branches: [main, master]
  pull_request:

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    # Fail a hung step (e.g. a stalled download in r-lib/actions/setup-r)
    # instead of waiting for GitHub\'s 6-hour default
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Count the tests that skip on CRAN too
      NOT_CRAN: "true"

    steps:
      - uses: actions/checkout@v4

      # So the tests that call pixi count towards coverage
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@v5
        with:
          # Fail if error if not on PR, or if on PR and token is given
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || secrets.CODECOV_TOKEN }}
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
