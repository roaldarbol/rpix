# Temporary: does building R packages from source with pixi-build-r work on
# Windows? Round 7: the entries rpix would write (#123), with the Windows
# parts in win-64 targets, in a project for macOS and Windows.
#   library-folder: a pure R package, as pixi-build-r writes it
#   build-tools:    a C++ package, with only the library folder worked around
name: test-source-builds

on:
  push:
    branches: [test/windows-source-builds]

permissions: read-all

jobs:
  build:
    name: windows-latest / ${{ matrix.case }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: pure-r
            pkg: fortunes
            entry: 'r-fortunes = { git = "https://github.com/cran/fortunes", package = { build.backend.name = "pixi-build-r", build.target.win-64.config.extra-args = ["--library=%PREFIX%/Lib/R/library"], host-dependencies = { r-base = "4.5.*" }, target.win-64.build-dependencies = { m2-make = "*", m2-sed = "*", m2-coreutils = "*" } } }'
          - case: cxx
            pkg: datey
            entry: 'r-datey = { git = "https://github.com/cran/datey", package = { build.backend.name = "pixi-build-r", build.target.win-64.config.extra-args = ["--library=%PREFIX%/Lib/R/library"], host-dependencies = { r-base = "4.5.*" }, target.win-64.build-dependencies = { m2-make = "*", m2-sed = "*", m2-coreutils = "*" } } }'
          - case: rust
            pkg: hellorust
            entry: 'r-hellorust = { git = "https://github.com/cran/hellorust", package = { build.backend.name = "pixi-build-r", build.target.win-64.config.extra-args = ["--library=%PREFIX%/Lib/R/library"], build-dependencies = { rust = "*" }, host-dependencies = { r-base = "4.5.*" }, target.win-64.build-dependencies = { m2-make = "*", m2-sed = "*", m2-coreutils = "*", rust-std-x86_64-pc-windows-gnu = "*" } } }'
    defaults:
      run:
        shell: bash
    steps:
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          run-install: false
      - name: Write the project
        env:
          ENTRY: ${{ matrix.entry }}
        run: |
          mkdir project
          cat > project/pixi.toml <<TOML
          [workspace]
          name = "source-build"
          channels = ["conda-forge"]
          platforms = ["osx-64", "win-64"]
          preview = ["pixi-build"]

          [dependencies]
          r-base = "4.5.*"
          # r-base in host-dependencies only works around prefix-dev/pixi#7214
          $ENTRY
          TOML
          cat project/pixi.toml
      - name: pixi info
        working-directory: project
        run: pixi info
      - name: Build and install
        working-directory: project
        run: pixi install 2>&1 | tee ../install.log; exit "${PIPESTATUS[0]}"
      - name: Load it
        working-directory: project
        run: |
          pixi run Rscript -e "library(${{ matrix.pkg }})"
          pixi run Rscript -e "cat(.libPaths(), sep = '\n')"
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-${{ matrix.case }}
          path: install.log
