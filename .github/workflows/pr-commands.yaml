# /document and /style commands on a pull request. Adapted from the animovement
# packages' shared workflow (https://github.com/animovement/.github), derived
# from https://github.com/r-lib/actions/tree/v2/examples
#
# Both jobs run only for comments by a member or owner on a pull request, so an
# outside comment cannot push.
name: pr-commands

on:
  issue_comment:
    types: [created]

permissions: read-all

jobs:
  document:
    if: ${{ github.event.issue.pull_request && (github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'OWNER') && startsWith(github.event.comment.body, '/document') }}
    name: document
    runs-on: ubuntu-latest
    # Fail a hung step (e.g. a stalled download in r-lib/actions/setup-r)
    # instead of waiting for GitHub\'s 6-hour default
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/pr-fetch@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # roxygen2 comes from the pixi environment (pixi.toml)
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: Document
        run: pixi run document

      - name: commit
        run: |
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add man/\* NAMESPACE
          # Nothing to document is a normal outcome, not a failure.
          git commit -m 'docs: regenerate man/ and NAMESPACE' || echo "No documentation changes"

      - uses: r-lib/actions/pr-push@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  style:
    if: ${{ github.event.issue.pull_request && (github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'OWNER') && startsWith(github.event.comment.body, '/style') }}
    name: style
    runs-on: ubuntu-latest
    # Fail a hung step (e.g. a stalled download in r-lib/actions/setup-r)
    # instead of waiting for GitHub\'s 6-hour default
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/pr-fetch@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # air, not styler: format-suggest enforces air formatting on every pull
      # request, so styling with anything else would be flagged immediately.
      # air comes from the pixi environment (pixi.toml).
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: Style
        run: pixi run format

      - name: commit
        run: |
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add \*.R
          # Already-formatted code is a normal outcome, not a failure.
          git commit -m 'chore: reformat with air' || echo "No formatting changes"

      - uses: r-lib/actions/pr-push@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
